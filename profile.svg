<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    width="1600"
    height="900"
    viewBox="0 0 1600 900">

<defs>

    <!-- =====================================================
         DARK OVERLAY
         ===================================================== -->

    <linearGradient id="darkOverlay" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#000000" stop-opacity="0.10"/>
        <stop offset="45%" stop-color="#000000" stop-opacity="0.08"/>
        <stop offset="72%" stop-color="#000000" stop-opacity="0.62"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.88"/>
    </linearGradient>


    <!-- center darkness behind text -->

    <radialGradient id="centerShadow"
                    cx="50%"
                    cy="69%"
                    r="42%">

        <stop offset="0%"
              stop-color="#000000"
              stop-opacity=".82"/>

        <stop offset="55%"
              stop-color="#000000"
              stop-opacity=".52"/>

        <stop offset="100%"
              stop-color="#000000"
              stop-opacity="0"/>

    </radialGradient>


    <!-- GOLD -->

    <linearGradient id="gold"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

        <stop offset="0%"
              stop-color="#6d4b1b"/>

        <stop offset="18%"
              stop-color="#b88435"/>

        <stop offset="50%"
              stop-color="#f2d49a"/>

        <stop offset="82%"
              stop-color="#b88435"/>

        <stop offset="100%"
              stop-color="#604117"/>

    </linearGradient>


    <!-- TEXT GOLD -->

    <linearGradient id="goldText"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

        <stop offset="0%"
              stop-color="#fff8e8"/>

        <stop offset="45%"
              stop-color="#e9dcc1"/>

        <stop offset="100%"
              stop-color="#a58a60"/>

    </linearGradient>


    <!-- PANEL -->

    <linearGradient id="panel"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

        <stop offset="0%"
              stop-color="#111111"
              stop-opacity=".78"/>

        <stop offset="100%"
              stop-color="#050505"
              stop-opacity=".90"/>

    </linearGradient>


    <!-- =====================================================
         TEXTURE / FILM GRAIN
         ===================================================== -->

    <filter id="grain"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">

        <feTurbulence
            type="fractalNoise"
            baseFrequency=".85"
            numOctaves="4"
            seed="12"
            stitchTiles="stitch"
            result="noise"/>

        <feColorMatrix
            in="noise"
            type="saturate"
            values="0"
            result="mono"/>

        <feComponentTransfer in="mono">
            <feFuncA
                type="table"
                tableValues="0 .12"/>
        </feComponentTransfer>

    </filter>


    <!-- DISTRESSED TEXTURE -->

    <filter id="distress">

        <feTurbulence
            baseFrequency=".025 .22"
            numOctaves="2"
            seed="7"
            type="fractalNoise"
            result="noise"/>

        <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="1.2"
            xChannelSelector="R"
            yChannelSelector="G"/>

    </filter>


    <!-- SOFT GLOW -->

    <filter id="goldGlow"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%">

        <feGaussianBlur
            stdDeviation="4"
            result="blur"/>

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>


    <!-- SHADOW -->

    <filter id="shadow"
            x="-30%"
            y="-30%"
            width="160%"
            height="160%">

        <feDropShadow
            dx="0"
            dy="7"
            stdDeviation="8"
            flood-color="#000000"
            flood-opacity=".9"/>

    </filter>


    <!-- VIGNETTE -->

    <radialGradient id="vignette"
                    cx="50%"
                    cy="45%"
                    r="72%">

        <stop offset="45%"
              stop-color="#000"
              stop-opacity="0"/>

        <stop offset="78%"
              stop-color="#000"
              stop-opacity=".32"/>

        <stop offset="100%"
              stop-color="#000"
              stop-opacity=".86"/>

    </radialGradient>


</defs>



<!-- =====================================================
     BACKGROUND
     ===================================================== -->

<rect
    width="1600"
    height="900"
    fill="#050505"/>


<!-- YOUR GIF -->

<image
    x="0"
    y="0"
    width="1600"
    height="900"
    preserveAspectRatio="xMidYMid slice"
    href="https://raw.githubusercontent.com/rockbirpariyar/rockbirpariyar/main/dark-souls.gif"/>



<!-- =====================================================
     CINEMATIC COLORING
     ===================================================== -->

<rect
    width="1600"
    height="900"
    fill="url(#darkOverlay)"/>

<rect
    width="1600"
    height="900"
    fill="url(#vignette)"/>

<ellipse
    cx="800"
    cy="670"
    rx="590"
    ry="290"
    fill="url(#centerShadow)"/>



<!-- subtle brown atmospheric wash -->

<rect
    width="1600"
    height="900"
    fill="#4a280c"
    opacity=".055"/>



<!-- =====================================================
     GRAIN
     ===================================================== -->

<rect
    width="1600"
    height="900"
    fill="#ffffff"
    filter="url(#grain)"
    opacity=".17"/>



<!-- =====================================================
     EMBERS
     ===================================================== -->

<g fill="#d87a20">

    <circle cx="320" cy="580" r="2">
        <animate
            attributeName="cy"
            values="580;530;580"
            dur="5s"
            repeatCount="indefinite"/>
        <animate
            attributeName="opacity"
            values=".1;1;.1"
            dur="5s"
            repeatCount="indefinite"/>
    </circle>


    <circle cx="1290" cy="530" r="2.5">
        <animate
            attributeName="cy"
            values="530;470;530"
            dur="4.2s"
            repeatCount="indefinite"/>
        <animate
            attributeName="opacity"
            values=".3;1;.3"
            dur="4.2s"
            repeatCount="indefinite"/>
    </circle>


    <circle cx="1180" cy="730" r="1.5">
        <animate
            attributeName="cy"
            values="730;660;730"
            dur="6s"
            repeatCount="indefinite"/>
    </circle>


    <circle cx="415" cy="700" r="1.8">
        <animate
            attributeName="cy"
            values="700;620;700"
            dur="5.6s"
            repeatCount="indefinite"/>
    </circle>


    <circle cx="1370" cy="670" r="2">
        <animate
            attributeName="opacity"
            values=".2;1;.2"
            dur="3.2s"
            repeatCount="indefinite"/>
    </circle>

</g>



<!-- =====================================================
     MAIN CONTENT
     ===================================================== -->

<g transform="translate(800 565)"
   text-anchor="middle">



    <!-- TOP TINY ORNAMENT -->

    <g opacity=".75">

        <line
            x1="-190"
            y1="-48"
            x2="-20"
            y2="-48"
            stroke="url(#gold)"
            stroke-width="1"/>

        <polygon
            points="0,-54 6,-48 0,-42 -6,-48"
            fill="none"
            stroke="#c79546"
            stroke-width="1.4"/>

        <line
            x1="20"
            y1="-48"
            x2="190"
            y2="-48"
            stroke="url(#gold)"
            stroke-width="1"/>

    </g>



    <!-- ROCKBIR -->

    <text
        x="0"
        y="22"
        fill="url(#goldText)"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="76"
        font-weight="400"
        letter-spacing="18"
        filter="url(#shadow)">
        ROCKBIR
    </text>



    <!-- MAIN DIVIDER -->

    <g transform="translate(0 58)">

        <line
            x1="-285"
            y1="0"
            x2="-13"
            y2="0"
            stroke="url(#gold)"
            stroke-width="1"/>

        <polygon
            points="0,-7 7,0 0,7 -7,0"
            fill="#1a1208"
            stroke="#dbab59"
            stroke-width="2"
            filter="url(#goldGlow)"/>

        <circle
            cx="0"
            cy="0"
            r="2.5"
            fill="#ffd98e"/>

        <line
            x1="13"
            y1="0"
            x2="285"
            y2="0"
            stroke="url(#gold)"
            stroke-width="1"/>

    </g>



    <!-- DEVELOPER -->

    <text
        x="0"
        y="98"
        fill="#ded6c6"
        font-family="'Courier New', monospace"
        font-size="20"
        letter-spacing="6">
        developer · builder
    </text>



    <!-- =================================================
         SOCIAL HUD
         ================================================= -->

    <g transform="translate(0 155)">


        <!-- Instagram -->

        <g transform="translate(-225 0)">

            <rect
                x="-32"
                y="-28"
                width="64"
                height="56"
                rx="5"
                fill="url(#panel)"
                stroke="#8c672c"
                stroke-opacity=".45"/>

            <circle
                cx="0"
                cy="-1"
                r="12"
                fill="none"
                stroke="#eee4d2"
                stroke-width="3"/>

            <rect
                x="-18"
                y="-19"
                width="36"
                height="36"
                rx="9"
                fill="none"
                stroke="#eee4d2"
                stroke-width="3"/>

            <circle
                cx="11"
                cy="-12"
                r="2.5"
                fill="#eee4d2"/>

            <text
                x="0"
                y="50"
                fill="#bfb5a2"
                font-family="'Courier New', monospace"
                font-size="11">
                Instagram
            </text>

        </g>



        <!-- vertical divider -->

        <line
            x1="-151"
            y1="-27"
            x2="-151"
            y2="27"
            stroke="#a9782f"
            opacity=".75"/>



        <!-- X -->

        <g transform="translate(-75 0)">

            <rect
                x="-32"
                y="-28"
                width="64"
                height="56"
                rx="5"
                fill="url(#panel)"
                stroke="#8c672c"
                stroke-opacity=".45"/>

            <text
                x="0"
                y="11"
                fill="#eee4d2"
                font-size="37"
                font-family="Arial">
                𝕏
            </text>

            <text
                x="0"
                y="50"
                fill="#bfb5a2"
                font-family="'Courier New', monospace"
                font-size="11">
                X
            </text>

        </g>



        <line
            x1="0"
            y1="-27"
            x2="0"
            y2="27"
            stroke="#a9782f"
            opacity=".75"/>



        <!-- LINKEDIN -->

        <g transform="translate(75 0)">

            <rect
                x="-32"
                y="-28"
                width="64"
                height="56"
                rx="5"
                fill="url(#panel)"
                stroke="#8c672c"
                stroke-opacity=".45"/>

            <text
                x="0"
                y="10"
                fill="#eee4d2"
                font-size="29"
                font-family="Arial"
                font-weight="700">
                in
            </text>

            <text
                x="0"
                y="50"
                fill="#bfb5a2"
                font-family="'Courier New', monospace"
                font-size="11">
                LinkedIn
            </text>

        </g>



        <line
            x1="151"
            y1="-27"
            x2="151"
            y2="27"
            stroke="#a9782f"
            opacity=".75"/>



        <!-- MAIL -->

        <g transform="translate(225 0)">

            <rect
                x="-32"
                y="-28"
                width="64"
                height="56"
                rx="5"
                fill="url(#panel)"
                stroke="#8c672c"
                stroke-opacity=".45"/>

            <path
                d="
                M-15 -10
                L0 3
                L15 -10

                M-15 -10
                V14
                H15
                V-10
                "
                fill="none"
                stroke="#eee4d2"
                stroke-width="3"
                stroke-linejoin="round"/>

            <text
                x="0"
                y="50"
                fill="#bfb5a2"
                font-family="'Courier New', monospace"
                font-size="11">
                Gmail
            </text>

        </g>


    </g>



    <!-- =================================================
         TECH PANEL
         ================================================= -->

    <g transform="translate(0 255)">

        <rect
            x="-245"
            y="-29"
            width="490"
            height="58"
            rx="4"
            fill="url(#panel)"
            stroke="#665033"
            stroke-opacity=".72"/>


        <text
            x="-218"
            y="7"
            fill="#d8a74f"
            font-family="Georgia"
            font-size="24">
            ›
        </text>


        <text
            x="0"
            y="5"
            fill="#cfc6b7"
            font-family="'Courier New', monospace"
            font-size="15"
            letter-spacing="3">
            software · technology · experiments
        </text>

    </g>



    <!-- =================================================
         VISITOR PANEL
         ================================================= -->

    <g transform="translate(0 330)">

        <rect
            x="-75"
            y="-20"
            width="150"
            height="40"
            rx="3"
            fill="#0a0a09"
            fill-opacity=".9"
            stroke="#68502c"/>


        <g transform="translate(-49 0)"
           stroke="#d1c8b7"
           fill="none"
           stroke-width="1.5">

            <rect
                x="-7"
                y="-7"
                width="15"
                height="14"/>

            <path
                d="
                M-4 4
                V0
                M0 4
                V-4
                M4 4
                V-2
                "/>

        </g>


        <text
            x="9"
            y="5"
            fill="#d5cbbb"
            font-family="'Courier New', monospace"
            font-size="12"
            letter-spacing="2">
            VISITORS
        </text>

    </g>



    <!-- =================================================
         END ORNAMENT
         ================================================= -->

    <g transform="translate(0 396)">

        <line
            y1="-18"
            y2="18"
            stroke="#a97931"
            stroke-width="2"/>

        <polygon
            points="0,27 5,32 0,37 -5,32"
            fill="none"
            stroke="#ba8840"/>

        <text
            x="0"
            y="67"
            fill="#bcb3a3"
            font-family="'Courier New', monospace"
            font-size="12">
            © rockbir
        </text>

    </g>


</g>



<!-- FINAL TEXTURE PASS -->

<rect
    width="1600"
    height="900"
    fill="#fff"
    filter="url(#grain)"
    opacity=".055"/>

</svg>
